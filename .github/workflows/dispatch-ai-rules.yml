# Dispatch AI Rules — push-based fan-out.
# Fires whenever ai-rules/ (or the renderer) changes on master, and pushes the
# regenerated shared rules block straight to every repo listed in
# ai-rules/manifest.yml, opening a PR in each with the diff. This is the
# "shared-workflows pushes out" counterpart to sync-ai-rules.yml (which a
# downstream repo calls to pull the latest rules on its own schedule) — use this
# one so edits here reach every repo immediately instead of waiting on a poll.
#
# Requires a repository secret AI_RULES_SYNC_TOKEN: a token with Contents
# (read/write) and Pull requests (read/write) access to every repo in
# ai-rules/manifest.yml. The default GITHUB_TOKEN only has permission on this
# repo, so it can't push branches or open PRs elsewhere.
#   - Simplest: a fine-grained PAT scoped to prep-network/prep-network,
#     prep-network/events, prep-network/data with those two permissions, added
#     under this repo's Settings -> Secrets and variables -> Actions.
#   - More robust long-term: a small dedicated GitHub App installed on those
#     three repos, minting a short-lived token per run via
#     actions/create-github-app-token instead of a long-lived PAT.
#
# Adding a repo: add it to ai-rules/manifest.yml and make sure
# AI_RULES_SYNC_TOKEN covers it — no workflow edits needed, the matrix below is
# generated from the manifest.

name: Dispatch AI Rules

on:
  push:
    branches: [master]
    paths:
      - 'ai-rules/**'
      - 'scripts/render_ai_rules.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --quiet pyyaml
      - id: list
        run: |
          python3 -c "
          import yaml, json
          m = yaml.safe_load(open('ai-rules/manifest.yml'))
          print('repos=' + json.dumps([t['repo'] for t in m['targets'].values()]))
          " >> "$GITHUB_OUTPUT"

  sync:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Checkout shared-workflows (ai-rules source)
        uses: actions/checkout@v4

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.AI_RULES_SYNC_TOKEN }}
          path: downstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install renderer dependencies
        run: pip install --quiet pyyaml

      - name: Render shared AI rules
        run: |
          python3 scripts/render_ai_rules.py \
            --manifest ai-rules/manifest.yml \
            --rules-root ai-rules \
            --repo "${{ matrix.repo }}" \
            --target-checkout downstream

      - name: Open PR with changes
        working-directory: downstream
        env:
          GH_TOKEN: ${{ secrets.AI_RULES_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to AI rules for ${{ matrix.repo }}; nothing to do."
            exit 0
          fi

          branch="chore/sync-ai-rules"
          base="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore: sync shared AI rules"
          git push --force origin "$branch"

          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "PR already open for $branch; pushed update."
          else
            gh pr create --title "chore: sync shared AI rules" \
              --base "$base" --head "$branch" \
              --body "Automated push from [prep-network/shared-workflows](https://github.com/prep-network/shared-workflows) after a change to \`ai-rules/\`. Review the diff before merging — these instructions steer AI coding assistants in this repo."
          fi
