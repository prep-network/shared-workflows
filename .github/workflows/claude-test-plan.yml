# Claude Test Plan — reusable workflow.
# Comment `/test-plan` on a PR to generate a QA test plan from the diff; pass an
# Asana task link (`/test-plan <asana-url>`) to attach it to that task as a subtask,
# plus a second, simpler "External Review" subtask for external reviewers.
# Any text after the link (`/test-plan <asana-url> focus on the mobile flow`) is
# treated as extra instructions for the plan — the caller parses it out of the
# comment and forwards it as the extra_instructions input.
#
# To adopt: add a caller workflow (on: issue_comment) that resolves the Asana link
# and calls this one — copy it from a repo already using it. Required secrets:
# ANTHROPIC_API_KEY and ASANA_TOKEN, set at the REPO or ORG level (NOT an Actions
# environment — a reusable-workflow-calling job can't reference one).
# Optional: set a repo/org Actions Variable STAGING_BASE_URL (e.g.
# https://staging.prephoops.com) and pass it as the staging_base_url input so plans
# link straight to the feature under test.

name: Claude Test Plan

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      staging_base_url:
        description: Base URL of the staging/test environment (e.g. https://staging.example.com). Empty to omit.
        required: false
        type: string
        default: ''
      asana_url:
        description: Optional Asana task URL (used for links). Empty to skip Asana.
        required: false
        type: string
        default: ''
      asana_gid:
        description: Resolved Asana parent task gid (the caller resolves this). Empty if none.
        required: false
        type: string
        default: ''
      asana_task_name:
        description: Pre-fetched Asana task name (the caller resolves this). Empty if none.
        required: false
        type: string
        default: ''
      asana_task_notes:
        description: Pre-fetched Asana task notes/description (the caller resolves this).
        required: false
        type: string
        default: ''
      extra_instructions:
        description: Optional free-text instructions from the requester (the caller parses any text after the Asana link in the /test-plan comment). Empty for defaults.
        required: false
        type: string
        default: ''
    secrets:
      anthropic_api_key:
        required: true
      asana_token:
        description: Asana Personal Access Token. Required only when asana_gid is provided.
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        env:
          ASANA_TOKEN: ${{ secrets.asana_token }}
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: |
            Generate a QA test plan for PR #${{ inputs.pr_number }}. Audience: QA testers,
            including juniors who may not be familiar with the feature. Where the finished
            plan is published depends on whether an Asana task was provided (see Step 3).

            Step 0 — Optional Asana task context (already fetched for you by the caller):
              Asana parent task gid (may be empty): ${{ inputs.asana_gid }}
              Asana task URL  (may be empty): ${{ inputs.asana_url }}
              Asana task name (may be empty): ${{ inputs.asana_task_name }}
              Asana task notes (may be empty, may span multiple lines):
              ${{ inputs.asana_task_notes }}

              If a task name and/or notes are provided above, use them to understand the
              intent and acceptance criteria — sharpen "What we're testing" and surface edge
              cases the diff alone wouldn't reveal. If they are empty, build the plan from
              the PR diff alone and do not mention any missing Asana context in the comment.

            Base test URL (may be empty): ${{ inputs.staging_base_url }}

            Additional instructions from the requester (may be empty, may span lines):
              ${{ inputs.extra_instructions }}

              If non-empty, follow them: they add context the diff and task can't provide
              (what to focus on, what to skip, environment quirks, audience notes) and they
              OVERRIDE the defaults and rules below wherever they conflict — except the
              Step 3 file-writing mechanics, which always apply exactly as written.

            Step 1 — Read PR context:
              gh pr view ${{ inputs.pr_number }} --json title,body,headRefName,baseRefName,files,url
              gh pr diff ${{ inputs.pr_number }}

              If the diff is large, focus on files most likely to have user-facing impact
              (views/blade templates, REST responses, app payloads). Skim infra files.

            Step 2 — Compose the test plan using EXACTLY this structure (shown as Markdown;
            Step 3 CASE A converts it to Asana HTML, CASE B keeps it as Markdown):

            > 🤖 **Draft test plan — review before use.** This was auto-generated from the
            > PR diff as a starting point. The developer should review it thoroughly for
            > accuracy and completeness before handing the task off to QA.
            >
            > PR: [<the PR title>](<the PR url from `gh pr view` above>)
            > <If an Asana task name was provided in Step 0, add a second line:
            >  "Asana: [<asana_task_name>](<asana_url>)". Omit this line entirely if no
            >  Asana task name was provided.>

            ## What we're testing
            One sentence in plain language describing what changed from a user's
            perspective. NO implementation jargon (avoid "meta keys", "hooks", "REST
            fields", "ACF", schema names, etc.). Frame as: what should the user notice or
            be able to do that they couldn't before?

            ## ⚠️ Confirm with the developer
            (Include this section ONLY if there are genuine discrepancies between the Asana
            task's stated requirements and what the diff implements. Omit the whole section
            if there are none.)
            - <Each item is a note for the DEVELOPER to reconcile before QA — not a test
              step. Frame as "spec says X, build does Y — confirm intended", never as a
              defect. e.g. "Task says 'show only the most recent evaluation'; the build shows
              all evaluations in a slider — confirm the change was intended.">

            ## Setup
            - Start with how to reach the feature. If a Base test URL is provided above, give
              ONE clickable link, formatted as "Open <feature/page name>: <link>" where the
              link is base URL + the affected page path from the diff. Do not also show the
              bare path, do not repeat the URL, and do not call it "suggested". If no base URL
              is provided, give the path and describe how to navigate. Then list required
              account types, test data, feature-flag states, app builds, browser, etc.

            ## Scenario 1: <short user-facing title, e.g. "Free user hits paywall">
            1. <first action the tester takes>
               → Expected: <what they should see immediately>
            2. <next action>
               → Expected: <what they should see>
            (Continue with numbered steps. Each step is one concrete action on its own line,
            with its expected result on the next line, indented and prefixed "→ Expected:".)

            ## Scenario 2: <next distinct flow>
            ...

            ## Edge cases worth checking
            - <single-line description of an edge case to verify>
            - <another edge case>

            Rules — do not violate:
            - Frame every scenario from the user's POV ("As a logged-out visitor, I tap…"),
              never the engineer's ("the paywall_status meta returns true").
            - Spec discrepancies belong ONLY in the "⚠️ Confirm with the developer" section —
              never in Setup or Edge cases (those are for QA to execute). Anchor discrepancies
              on the task's DESCRIPTION / acceptance criteria, NOT its title: titles are loose
              labels, so never flag a title-vs-UI-copy difference on its own. Flag exact-copy
              mismatches with high confidence; hedge behavioral deviations as "confirm
              intended". If there are none (or no Asana task was provided), omit the section.
            - Format every step as a numbered action on its own line, with its expected
              result on the next line, indented and prefixed "→ Expected:". Never group all
              expected results at the bottom of a scenario.
            - Turn EVERY site-relative path into a full clickable link when a Base test URL is
              provided — anywhere in the plan, not just Setup. Render it as base URL + path
              (e.g. /wp-admin → <base>/wp-admin, /colleges/ → <base>/colleges/). The base URL
              has no trailing slash and paths begin with "/", so just join them. If no Base
              test URL is provided, leave paths as-is.
            - Complete but lean: cover every distinct user-facing behavior the diff changes,
              and nothing beyond that. Scale the number of scenarios to the size of the change
              — a small PR may need only one or two; a large feature may need many.
            - One user flow per scenario — split genuinely distinct flows (e.g. "no favorites"
              vs "no player claimed") into separate scenarios, but fold a trivial one-step
              check into a related scenario instead of giving it its own heading.
            - Only generate scenarios for behavior the diff actually changes. Don't pad with
              tests for unchanged code, and don't restate the same flow twice.
            - Keep steps terse: one action and its expected result, no narration.
            - Every step's expected result must be independently verifiable. Don't write a
              step whose "→ Expected" just restates the action (e.g. "note the player →
              you know the player"). Fold such prep actions into the step they set up.
            - Avoid vague phrases like "should work" or "behaves correctly." State the
              specific UI element, copy, value, or page that should appear.
            - Always begin the comment with the draft-review disclaimer callout above,
              including in the infrastructure-only case below.
            - If the PR is purely infrastructure / dev tooling / refactor with no
              user-visible change, write just the disclaimer and the "What we're testing"
              section saying that, list any internal-only verification steps, and skip
              user scenarios.

            Step 2b — External reviewer plan. ONLY if the Asana parent task gid in Step 0 is
            NON-empty, also compose a SEPARATE, much simpler plan for EXTERNAL reviewers —
            the client or stakeholder who requested the feature. They are not QA testers:
            they need a quick pass to confirm the finished task matches their expectations,
            not exhaustive coverage. It has NO opening disclaimer or PR link — reviewers see
            this subtask directly in Asana, so it begins at the first header. Structure:

            ## What changed
            One plain-language sentence (may reuse "What we're testing").

            ## How to see it
            The single clickable link (or navigation description) from Setup, plus only the
            login/account info an outsider would need. No feature flags, test-data recipes,
            or internal tooling.

            ## What to confirm
            - Do <simple action> — confirm <expected outcome>.
            - <next item>

            ## Does it match what you expected?
            Two sentences, addressed to the reviewer: if anything looks different from what
            you asked for, reply on this task with what you expected instead; if it all
            looks right, reply here to confirm and we'll move it along.

            Rules for the external plan:
            - Aim for ~5 items, 8 at the absolute most, each exactly ONE line: a single
              action and what to confirm. No multi-step numbered scenarios, no dev notes.
            - Collapse the internal plan's scenarios to their essence: one item per
              user-facing behavior, phrased in the same "confirm ..." voice as the heading.
              Fold micro-interactions (individual links, icons, dropdowns in the same panel)
              into their parent behavior instead of listing each one.
            - Skip edge cases UNLESS an external reviewer would plausibly hit one on a
              normal pass (e.g. a page with no data yet) — then include it as one item.
            - Plain language only — even less jargon than the internal plan tolerates.
            - The entire plan must stand alone for an outsider: no PR or repo links, no
              internal tool names, nothing addressed to the team. If the feature is only
              reachable with internal credentials, say in "How to see it" what access the
              reviewer should request from the team.
            - NEVER include the "⚠️ Confirm with the developer" content here; that
              conversation is internal.

            Step 3 — Write the plan to files. Do NOT post anything and do NOT call gh, curl,
            or the Asana API — later workflow steps publish these files. Always use the Write
            tool (never build file bodies inline in a shell command, which drops characters).

              ALWAYS write the COMPLETE Markdown plan from Step 2 to:
                /tmp/test-plan.md

              ADDITIONALLY, if the Asana parent task gid in Step 0 is NON-empty, also write:
                - an Asana rich-text version of the SAME plan to /tmp/test-plan.html
                - the external reviewer plan from Step 2b as Markdown to
                  /tmp/external-test-plan.md and as Asana rich text to
                  /tmp/external-test-plan.html
              Asana descriptions are NOT Markdown — in the rich-text files use only Asana's
              supported tags:
                - Wrap everything in a single <body>…</body>.
                - Allowed tags ONLY: <h1> <h2> <ul> <ol> <li> <strong> <em> <u> <s> <code>
                  <a href> <hr/>. Use <h2> for the "## ..." section headers, <ol><li> for
                  numbered steps, nested <ul><li> for expected results.
                - Render the internal plan's draft-review disclaimer as the first paragraph
                  in <strong>. The external plan has no opening callout — it starts
                  directly at the "What changed" header.
                - Make EVERY URL clickable by wrapping it: <a href="URL">link text</a>.
                  Asana does NOT auto-link bare URLs. This includes the staging test link,
                  the PR link, and the Asana link. Escape & in URLs as &amp; (e.g. query
                  params: href="…?player_id=5&amp;foo=bar").
                - Do NOT use Markdown symbols (##, -, ✅, >, [text](url)) inside the HTML.
                - It MUST be well-formed XHTML — Asana rejects invalid XML with HTTP 400.
                  ESCAPE every literal &, <, > in text as &amp; &lt; &gt; (e.g. write
                  "GPA &lt; 3.0" and "Undergrads &amp; GPA"). Self-close void tags as <hr/>.
                  Close every tag and nest correctly.
                - Do NOT use any tag outside the allowed list (no <p>, <br>, <h3>, <div>,
                  <span>, <b>, <i>, <table>). Separate paragraphs with allowed block tags,
                  never <br> or blank lines.

            Stop after writing the file(s). The workflow publishes them in the next steps.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Read,Write,Glob,Grep"

      - name: Publish plan to Asana subtask
        id: asana
        if: ${{ inputs.asana_gid != '' }}
        env:
          ASANA_TOKEN: ${{ secrets.asana_token }}
          PARENT: ${{ inputs.asana_gid }}
        run: |
          set -uo pipefail

          # Fetch existing subtasks once; both publishes match against this list.
          subtasks=$(curl -s -H "Authorization: Bearer $ASANA_TOKEN" \
            "https://app.asana.com/api/1.0/tasks/$PARENT/subtasks?opt_fields=name")

          # publish <name_match> <subtask_name> <html_file> <md_file>
          # Creates or updates one subtask; prints its permalink URL on success (logs → stderr).
          publish() {
            match="$1"; subtask_name="$2"; html_file="$3"; md_file="$4"

            # Find an existing auto subtask (match by name).
            existing=$(printf '%s' "$subtasks" | jq -r --arg m "$match" \
              '[.data[] | select(.name | contains($m))] | first | .gid // empty')

            # Send a payload file to Asana — PUT if updating an existing subtask, POST to create.
            send() {
              if [ -n "$existing" ]; then
                curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $ASANA_TOKEN" \
                  -H "Content-Type: application/json" -d @"$1" \
                  "https://app.asana.com/api/1.0/tasks/$existing?opt_fields=permalink_url"
              else
                curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $ASANA_TOKEN" \
                  -H "Content-Type: application/json" -d @"$1" \
                  "https://app.asana.com/api/1.0/tasks/$PARENT/subtasks?opt_fields=permalink_url"
              fi
            }

            url=""
            # Attempt 1: rich html_notes (Asana requires strict, well-formed XHTML).
            if [ -s "$html_file" ]; then
              jq -n --arg name "$subtask_name" --rawfile notes "$html_file" \
                '{data:{name:$name, html_notes:$notes}}' > /tmp/asana-payload.json
              resp=$(send /tmp/asana-payload.json)
              code=$(printf '%s' "$resp" | tail -n1)
              body=$(printf '%s' "$resp" | sed '$d')
              echo "Asana html_notes write for \"$subtask_name\" HTTP status: $code" >&2
              url=$(printf '%s' "$body" | jq -r '.data.permalink_url // empty')
              [ -z "$url" ] && printf 'Asana error body: %s\n' "$body" >&2
            fi

            # Attempt 2 (fallback): plain-text notes from the Markdown — never fails XML parsing.
            if [ -z "$url" ] && [ -s "$md_file" ]; then
              echo "::warning::Rich HTML for \"$subtask_name\" rejected or missing; retrying with plain-text notes." >&2
              jq -n --arg name "$subtask_name" --rawfile notes "$md_file" \
                '{data:{name:$name, notes:$notes}}' > /tmp/asana-payload-plain.json
              resp=$(send /tmp/asana-payload-plain.json)
              code=$(printf '%s' "$resp" | tail -n1)
              body=$(printf '%s' "$resp" | sed '$d')
              echo "Asana plain-notes write for \"$subtask_name\" HTTP status: $code" >&2
              url=$(printf '%s' "$body" | jq -r '.data.permalink_url // empty')
              [ -z "$url" ] && printf 'Asana error body: %s\n' "$body" >&2
            fi

            printf '%s' "$url"
          }

          # NOTE: the two match strings must never be substrings of each other's names.
          # They also still match subtasks created under the pre-rename names ("🤖 QA Test
          # Plan (auto-generated)" etc.), which the update PUT renames in place.
          url=$(publish "QA Test Plan" \
            "🤖 QA Test Plan" /tmp/test-plan.html /tmp/test-plan.md)
          ext_url=$(publish "External Review" \
            "🤖 External Review" \
            /tmp/external-test-plan.html /tmp/external-test-plan.md)

          if [ -n "$url" ]; then
            echo "subtask_url=$url" >> "$GITHUB_OUTPUT"
            echo "✅ Test plan written to Asana subtask: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Asana write failed; full plan will be posted on the PR instead."
            echo "⚠️ Asana write failed — full plan posted on the PR instead." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$ext_url" ]; then
            echo "external_subtask_url=$ext_url" >> "$GITHUB_OUTPUT"
            echo "✅ External review plan written to Asana subtask: $ext_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::External review plan was not written to Asana (missing or rejected)."
            echo "⚠️ External review plan was not written to Asana." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          SUBTASK_URL: ${{ steps.asana.outputs.subtask_url }}
          EXTERNAL_SUBTASK_URL: ${{ steps.asana.outputs.external_subtask_url }}
        run: |
          set -uo pipefail
          marker="<!-- claude-test-plan -->"
          if [ -n "${SUBTASK_URL:-}" ]; then
            # CASE A success: PR gets a short pointer to the Asana subtask(s).
            {
              printf '🤖 **QA test plan generated** and added to the Asana task as a subtask:\n'
              printf '**[🤖 QA Test Plan](%s)**\n' "$SUBTASK_URL"
              if [ -n "${EXTERNAL_SUBTASK_URL:-}" ]; then
                printf '**[🤖 External Review](%s)**\n' "$EXTERNAL_SUBTASK_URL"
                printf '\nReview both before handing the task off to QA — external reviewers see the External Review subtask as-is.\n\n'
              else
                printf '\nReview it there before handing the task off to QA.\n\n'
              fi
              printf '%s\n' "$marker"
            } > /tmp/pr-comment.md
          else
            # CASE B (or Asana fallback): post the full plan on the PR.
            if [ ! -s /tmp/test-plan.md ]; then
              echo "::error::No /tmp/test-plan.md produced and no Asana subtask; nothing to post."
              exit 1
            fi
            cp /tmp/test-plan.md /tmp/pr-comment.md
            grep -qF "$marker" /tmp/pr-comment.md || printf '\n%s\n' "$marker" >> /tmp/pr-comment.md
          fi
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\"))] | first | .id // empty")
          if [ -n "$existing" ]; then
            echo "Updating existing PR comment $existing"
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@/tmp/pr-comment.md >/dev/null
          else
            echo "Creating new PR comment"
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/pr-comment.md
          fi
